name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          output_file: github-contribution-grid-snake.svg
          svg_width: 900
          svg_height: 300
          color_left: "#7C3AED"
          color_right: "#4F46E5"
          color_grid: "#1f1b2e"
          color_head: "#FF6B6B"
          eat_enabled: true
          eat_speed: 80

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: snake-animation
          path: github-contribution-grid-snake.svg
          retention-days: 1

      - name: Push to repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add github-contribution-grid-snake.svg
          git diff --staged --quiet || git commit -m "🐍 Update contribution snake animation [skip ci]"
          git push origin ${{ github.ref_name }}
