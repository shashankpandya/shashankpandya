<svg
  width="1200"
  height="420"
  viewBox="0 0 1200 420"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="420">
      <stop stop-color="#090E1A"/>
      <stop offset="0.55" stop-color="#10172A"/>
      <stop offset="1" stop-color="#15112B"/>
    </linearGradient>

    <linearGradient id="accent" x1="240" y1="0" x2="980" y2="420">
      <stop stop-color="#67E8F9"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>

    <linearGradient id="fadeLine" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#67E8F9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A78BFA" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glowOne">
      <stop stop-color="#7C3AED" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowTwo">
      <stop stop-color="#06B6D4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path
        d="M 42 0 L 0 0 0 42"
        fill="none"
        stroke="#FFFFFF"
        stroke-opacity="0.035"
        stroke-width="1"
      />
    </pattern>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <clipPath id="rounded">
      <rect width="1200" height="420" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1200" height="420" fill="url(#background)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>

    <circle cx="1020" cy="40" r="310" fill="url(#glowOne)"/>
    <circle cx="120" cy="390" r="270" fill="url(#glowTwo)"/>

    <!-- Decorative system paths -->
    <path
      d="M820 104H940L990 154H1125"
      stroke="#67E8F9"
      stroke-opacity="0.28"
      stroke-width="1.5"
    />
    <path
      d="M885 310H1010L1054 266H1160"
      stroke="#A78BFA"
      stroke-opacity="0.3"
      stroke-width="1.5"
    />
    <path
      d="M970 194H1080L1118 232H1200"
      stroke="#F472B6"
      stroke-opacity="0.24"
      stroke-width="1.5"
    />

    <circle cx="820" cy="104" r="5" fill="#67E8F9"/>
    <circle cx="990" cy="154" r="5" fill="#A78BFA"/>
    <circle cx="885" cy="310" r="5" fill="#A78BFA"/>
    <circle cx="1054" cy="266" r="5" fill="#F472B6"/>
    <circle cx="970" cy="194" r="5" fill="#67E8F9"/>

    <!-- Decorative terminal -->
    <rect
      x="872"
      y="124"
      width="238"
      height="168"
      rx="14"
      fill="#080D18"
      stroke="#FFFFFF"
      stroke-opacity="0.1"
    />

    <circle cx="896" cy="148" r="4" fill="#F87171"/>
    <circle cx="912" cy="148" r="4" fill="#FBBF24"/>
    <circle cx="928" cy="148" r="4" fill="#34D399"/>

    <path d="M896 182L910 194L896 206" stroke="#67E8F9" stroke-width="3"/>
    <rect x="921" y="203" width="54" height="3" rx="1.5" fill="#A78BFA"/>
    <rect x="921" y="181" width="112" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.5"/>
    <rect x="896" y="232" width="142" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.16"/>
    <rect x="896" y="251" width="96" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.1"/>

    <!-- Main identity -->
    <text
      x="82"
      y="92"
      fill="#94A3B8"
      font-family="'Courier New', monospace"
      font-size="17"
      letter-spacing="4"
    >
      SOFTWARE ENGINEERING / 2026
    </text>

    <text
      x="78"
      y="184"
      fill="#F8FAFC"
      font-family="Arial, Helvetica, sans-serif"
      font-size="64"
      font-weight="700"
      letter-spacing="-2"
    >
      SHASHANK
    </text>

    <text
      x="78"
      y="250"
      fill="url(#accent)"
      font-family="Arial, Helvetica, sans-serif"
      font-size="64"
      font-weight="700"
      letter-spacing="-2"
    >
      PANDYA
    </text>

    <rect x="80" y="282" width="620" height="2" fill="url(#fadeLine)"/>

    <text
      x="80"
      y="325"
      fill="#CBD5E1"
      font-family="'Courier New', monospace"
      font-size="19"
    >
      FULL-STACK  ·  SERVERLESS  ·  APPLIED AI
    </text>

    <text
      x="80"
      y="366"
      fill="#64748B"
      font-family="'Courier New', monospace"
      font-size="15"
      letter-spacing="1"
    >
      Building useful systems from interface to infrastructure.
    </text>

    <circle
      cx="1144"
      cy="65"
      r="7"
      fill="#34D399"
      filter="url(#softGlow)"
    />
    <circle cx="1144" cy="65" r="4" fill="#34D399"/>
  </g>

  <rect
    x="0.75"
    y="0.75"
    width="1198.5"
    height="418.5"
    rx="27.25"
    stroke="#FFFFFF"
    stroke-opacity="0.08"
    stroke-width="1.5"
  />
</svg>
